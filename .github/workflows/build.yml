name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  ALIRE_VERSION: "2.0.2"
  G3D_OS: linux

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SwarmAda
        uses: actions/checkout@v4
        with:
          path: swarmada

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
            libx11-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev liblua5.3-dev \
            gnat gprbuild

      - name: Install Alire
        run: |
          wget -q "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip -q "alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          sudo mv bin/alr /usr/local/bin/
          alr --version

      - name: Clone GLOBE_3D
        run: git clone --depth 1 https://github.com/zertovitch/globe-3d.git globe-3d

      - name: Build GLOBE_3D
        working-directory: globe-3d
        run: gprbuild -P globe_3d.gpr

      - name: Build SwarmAda (alr build)
        working-directory: swarmada
        run: alr -n build

      - name: Verify executable was produced
        working-directory: swarmada
        run: test -x ./bin/swarmada
